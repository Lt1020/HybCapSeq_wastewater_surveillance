name: ERCC calibration tests
on:
  push:
    paths:
      - 'tools/ercc-record-audit/**'
      - '.github/workflows/ercc-calibration-tests.yml'
  pull_request:
    paths:
      - 'tools/ercc-record-audit/**'
      - '.github/workflows/ercc-calibration-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    defaults:
      run:
        working-directory: tools/ercc-record-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade setuptools wheel
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: |
          ercc-audit fit-ercc --samples examples/simulated/samples.tsv --standards examples/simulated/standards.tsv --observations examples/simulated/observations.tsv --outdir results-ci
