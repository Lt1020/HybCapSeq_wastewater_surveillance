[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ercc-record-audit"
version = "0.1.0"
description = "ERCC-only calibration and laboratory record validation"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
ercc-audit = "ercc_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

